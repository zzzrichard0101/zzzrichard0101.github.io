<g fill="#2d352e" stroke="#526255"><rect x="76" y="306" width="278" height="240" rx="8"/><rect x="406" y="306" width="278" height="240" rx="8"/><rect x="736" y="306" width="278" height="240" rx="8"/><rect x="1066" y="306" width="298" height="240" rx="8"/></g>
