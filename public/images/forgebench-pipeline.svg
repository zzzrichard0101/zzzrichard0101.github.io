<g fill="#edf1e8" font-size="28" font-weight="600"><text x="100" y="399">Task contract</text><text x="430" y="399">Agent workspace</text><text x="760" y="399">Policy replay</text><text x="1090" y="399">External grader</text></g>
<g fill="#b1b7af" font-size="21"><text x="100" y="447">Tools + budgets</text><text x="100" y="483">Protected evidence</text><text x="430" y="447">Plan / tools / recovery</text><text x="430" y="483">Append-only traces</text><text x="760" y="447">Identical base artifact</text><text x="760" y="483">Probes + model checks</text><text x="1090" y="447">Hidden requirements</text><text x="1090" y="483">Success + safety</text></g>
