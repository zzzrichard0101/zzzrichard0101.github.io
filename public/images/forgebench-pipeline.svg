<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">ForgeBench evaluation pipeline</title><desc id="desc">A frozen task runs in an isolated agent workspace. Six verification policies replay identical artifacts before external grading. Execution traces and SHA-256 hashes connect the evidence.</desc>
